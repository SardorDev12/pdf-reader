# Publishes a JavaScript-only over-the-air update with EAS Update.
#
# Runs AUTOMATICALLY on every push to main, and manually from the Actions tab.
# Publishes to both the "preview" and "production" update branches, so installed builds on either channel get it.
# Needs the EXPO_TOKEN repository secret.
#
# Safety: OTA updates can only change JS/assets. If a push changes native code (a library with native code, native
# config in app.json, or the icon/splash), the update is SKIPPED with a notice in the job summary - ship a new
# build with "EAS Build (Android)" instead. A failing type-check also stops the update.
name: EAS Update (OTA)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/eas-build.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: EAS Update branch(es) to publish to
        type: choice
        options: [both, preview, production]
        default: both

concurrency:
  group: eas-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.branch || 'both' }}
      UPDATE_MESSAGE: ${{ github.event.head_commit.message || format('Manual update from {0}', github.ref_name) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preflight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN secret (see docs/RELEASING.md)."; exit 1
          fi
          if grep -q REPLACE_WITH_EAS_PROJECT_ID app.json; then
            echo "::error::app.json still contains REPLACE_WITH_EAS_PROJECT_ID (see docs/RELEASING.md)."; exit 1
          fi

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - run: npx tsc --noEmit

      - name: Native-change guard
        id: guard
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            node scripts/check-native-change.mjs "$BEFORE"
          else
            echo "Manual run: skipping the native-change check."
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish update
        if: steps.guard.outputs.native != 'true'
        run: |
          case "$TARGET" in
            both) BRANCHES="preview production" ;;
            *) BRANCHES="$TARGET" ;;
          esac
          for b in $BRANCHES; do
            eas update --branch "$b" --message "$UPDATE_MESSAGE" --non-interactive
          done
